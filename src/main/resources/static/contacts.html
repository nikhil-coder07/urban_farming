<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - AeroFarm ERP</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <aside class="app-sidebar">
        <div class="brand-header">
            <div>
                <div class="brand-title">AeroFarm ERP</div>
                <div class="brand-subtitle">Aeroponic Ops & Accounting</div>
            </div>
        </div>
        <ul class="nav-list">
            <li class="nav-item"><a href="/index.html">Dashboard</a></li>
            <li class="nav-item active"><a href="/contacts.html">Contacts</a></li>
            <li class="nav-item"><a href="/products.html">Products</a></li>
            <li class="nav-item"><a href="/accounts.html">Chart of Accounts</a></li>
            <li class="nav-item"><a href="/towers.html">Towers & Telemetry</a></li>
            <li class="nav-item"><a href="/purchases.html">Purchases</a></li>
            <li class="nav-item"><a href="/sales.html">Sales</a></li>
            <li class="nav-item"><a href="/reports.html">Reports</a></li>
        </ul>
    </aside>

    <main class="app-main">
        <header class="top-bar">
            <h1 class="page-title">Master Data: Contacts Management</h1>
            <div class="date-display" id="current-date">--</div>
        </header>

        <div class="content-container">
            <div id="alert-box" class="alert"></div>

            <div class="panel">
                <div class="panel-header">
                    <span id="form-title">Add New Contact</span>
                </div>
                <form id="contact-form">
                    <input type="hidden" id="contact-id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="contact-name">Contact Name</label>
                            <input type="text" id="contact-name" class="form-control" placeholder="e.g. FreshMart Ltd" required>
                        </div>
                        <div class="form-group">
                            <label for="contact-type">Contact Type</label>
                            <select id="contact-type" class="form-control" required>
                                <option value="CUSTOMER">CUSTOMER</option>
                                <option value="VENDOR">VENDOR</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="contact-phone">Phone Number</label>
                            <input type="text" id="contact-phone" class="form-control" placeholder="e.g. 9876543210">
                        </div>
                        <div class="form-group">
                            <label for="contact-address">Address</label>
                            <input type="text" id="contact-address" class="form-control" placeholder="e.g. 12 Bio Street, Sector 4">
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" id="save-btn">Save Contact</button>
                        <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>Contacts Directory</span>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contacts-table-body">
                            <tr><td colspan="6">Loading contacts...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/contacts.js"></script>
</body>
</html>
